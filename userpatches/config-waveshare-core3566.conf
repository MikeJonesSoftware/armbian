# This file contains all of the Armbian command-line arguments that should be supplied to the compile.sh script.
# This file is specifically for the Waveshare Core3566 with Rockchip RK3566 SoC.
# Note that it references the nanopineo-customize-image.sh extension files, which contains H3-specific values.

# Hardware is actually a Waveshare Core3566
BOARD=luckfox-core3566

# Default username to 'ubuntu' if not provided
NEWUSER=ubuntu

# Specify the Linux branch, which should almost always be "current"
# <url>
BRANCH=current

# 32-bit CPUs require Docker to provide ARM32 to ARM64 cross-compilation support
DOCKER=yes

# Specify the kernel major.minor version
# The KERNELBRANCH below should reference this version.
KERNEL_MAJOR_MINOR=6.12

# Specify the kernel branch so we build the same thing each time
# This appears to be deprectaed as a user-supplied argument
#KERNELBRANCH=’tag:v6.12.47’
KERNELBRANCH='tag:v6.12.71'

# Specify the Ubuntu release number, noble is 24.04 LTS
# Go here to see the Ubuntu release history to pick a different release:
# <url>
RELEASE=noble

# Do NOT create a minimal build
BUILD_MINIMAL=no

# Do NOT build a Desktop
BUILD_DESKTOP=no

# Do NOT pause the build to ask kernel-specific questions, take all the defaults except what I specify here or on the command-line
KERNEL_CONFIGURE=no

# Tell the build system to download either the full or partial linux kernel source code
# KERNEL_GIT=shallow
KERNEL_GIT=full

# Install the kernel C/C++ header files so I can build kernel-mode drivers on the device
INSTALL_HEADERS=yes

# Disable AUFS because I forget
AUFS=no

# Disable additional Wifi drivers as they caused compile errors with PREEMT_RT patches
EXTRAWIFI=no

# Specify xz as the output compression, because it's the only one supported these days
COMPRESS_OUTPUTIMAGE=xz

# Setup all the post-image waveshare stuff
ENABLE_EXTENSIONS=customize-image-waveshare-core3566


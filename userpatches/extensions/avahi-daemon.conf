# See avahi-daemon.conf(5) for more information on this configuration
# file!

[server]
# 1. Be explicit about the hostname to prevent auto-renaming to -2, -3
host-name=eid-00000001
domain-name=local

# 2. Strict Protocol Control
use-ipv4=yes
use-ipv6=no

# 3. CRITICAL: Replace 'eth0' with your actual interface name (check with 'ip link')
allow-interfaces=end0 

# 4. Prevent the "Withdrawal" of records due to minor network blips
check-response-ttl=no
use-iff-running=no

# 5. Increase cache slightly to ensure it doesn't "exhaust" during Jenkins polls
cache-entries-max=0

# 6. Keep your existing ratelimit (this is good)
#ratelimit-interval-usec=1000000
ratelimit-interval-usec=0
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
# Force the device to actually tell the network its IP
publish-addresses=yes

# Tell the network "I am a Door Controller" metadata
publish-hinfo=yes

# Ensure the hostname (eid-00000001.local) is explicitly broadcast
publish-workstation=no

# Announce that the .local domain exists here
publish-domain=yes

# CRITICAL FIX: Allow the IPv4 address to be announced on the IPv6 
# multicast group. This is likely why the Mac (IPv6 friendly) sees 
# it longer than Jenkins (IPv4 only).
publish-a-on-ipv6=yes

# Allow the opposite (rarely needed, but good for symmetry)
publish-aaaa-on-ipv4=yes

# Keep these defaults active
disable-publishing=no
disable-user-service-publishing=no
add-service-cookie=yes

[reflector]
#enable-reflector=no
#reflect-ipv=no
#reflect-filters=_airplay._tcp.local,_raop._tcp.local

[rlimits]
# Allow the daemon to use up to 32MB of RAM for its cache and processing
rlimit-data=33554432

# Increase the number of allowable processes to prevent "fork failures"
rlimit-nproc=10

# Standard file descriptor limit
rlimit-nofile=1024

# Keep core dumps disabled for security/disk space
rlimit-core=0

# Default stack and file size are usually fine
rlimit-stack=8388608
rlimit-fsize=0
